
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF MERGER</title>

<style>
body {
    background:#020617;
    color:white;
    font-family:sans-serif;
    text-align:center;
}
.card {
    background:#111827;
    padding:20px;
    margin:20px;
    border-radius:12px;
}
button {
    padding:10px 20px;
    background:#6366f1;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}
button:hover {
    background:#4f46e5;
}
.file {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:10px;
    padding:15px;
    background:#1e293b;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>PDF MERGER</h1>
<p>Combine PDFs in the easiest way.</p>

<div class="card">
    <input type="file" id="pdfs" multiple accept=".pdf,application/pdf">
    <br><br>
    <button onclick="merge()">Merge PDFs</button>
</div>

<h3 onclick="unlock()" style="cursor:pointer;">
    ✨ More Options ✨
</h3>

<div id="secret" style="display:none;">

    <div class="card">
        <p>Hmmm... this is something new, give it a try!</p>

        <input type="file" id="file">

        <br><br>

        <button id="uploadBtn" onclick="upload()">Upload</button>
    </div>

    <div class="card">
        <p>Thanks.</p>
        <div id="list"></div>
    </div>

</div>

<script>

let unlocked = false;

// ===== UNLOCK =====
function unlock() {

    if(unlocked) return;

    const pass = prompt("Enter password:");

    if(pass === null) return;

    if(pass === "1234") {
        unlocked = true;
        document.getElementById("secret").style.display = "block";
        loadFiles();
    } else {
        alert("Wrong password");
    }
}

// ===== MERGE PDF =====
async function merge() {

    const files = document.getElementById("pdfs").files;

    if(files.length < 2) {
        alert("Please select at least 2 PDF files.");
        return;
    }

    const form = new FormData();

    for(let f of files) {
        form.append("pdfs", f);
    }

    try {

        const res = await fetch("/merge", {
            method:"POST",
            body:form
        });

        if(!res.ok) {
            throw new Error("Merge failed");
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "merged.pdf";
        a.click();

        URL.revokeObjectURL(url);

    } catch(error) {
        alert(error.message);
    }
}

// ===== UPLOAD =====
async function upload() {

    const file = document.getElementById("file").files[0];

    if(!file) {
        alert("Please select a file first.");
        return;
    }

    const form = new FormData();
    form.append("file", file);

    const btn = document.getElementById("uploadBtn");
    btn.innerText = "Uploading...";
    btn.disabled = true;

    try {

        const res = await fetch("/upload", {
            method:"POST",
            body:form
        });

        const data = await res.json();

        if(!res.ok || !data.success) {
            throw new Error(data.message || "Upload failed");
        }

        alert("File uploaded successfully!");

        document.getElementById("file").value = "";

        await loadFiles();

    } catch(error) {
        alert(error.message);
    }

    btn.innerText = "Upload";
    btn.disabled = false;
}

// ===== LOAD FILES =====
async function loadFiles() {

    const list = document.getElementById("list");

    try {

        const res = await fetch("/files");

        if(!res.ok) throw new Error("Unable to load files");

        const files = await res.json();

        list.innerHTML = "";

        files.forEach(f => {

            const row = document.createElement("div");
            row.className = "file";

            const name = document.createElement("span");
            name.textContent = f.original_filename;

            const actions = document.createElement("div");

            const downloadBtn = document.createElement("button");
            downloadBtn.textContent = "Download";

            downloadBtn.onclick = () => {
                window.location.href =
                    "/download?public_id=" + encodeURIComponent(f.public_id);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";

            deleteBtn.onclick = () => del(f.public_id);

            actions.appendChild(downloadBtn);
            actions.appendChild(deleteBtn);

            row.appendChild(name);
            row.appendChild(actions);

            list.appendChild(row);

        });

    } catch(error) {
        list.textContent = error.message;
    }
}

// ===== DELETE DIRECTLY WITH PASSWORD =====
async function del(id) {

    // Directly ask for admin password.
    // No "Are you sure?" confirmation popup.

    const pass = prompt("Admin password:");

    // Cancel clicked
    if(pass === null) {
        return;
    }

    // Empty password
    if(pass.trim() === "") {
        alert("Password cannot be empty.");
        return;
    }

    try {

        const res = await fetch("/delete", {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                public_id:id,
                adminPassword:pass
            })
        });

        const data = await res.json();

        if(data.success) {

            alert("File deleted successfully!");

            loadFiles();

        } else {

            alert("Wrong admin password or deletion failed.");

        }

    } catch(error) {

        alert("Server error. Please try again.");

    }
}

</script>

</body>
</html>
