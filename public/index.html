
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF MERGER</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #020617;
    color: white;
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px 10px;
}

h1 {
    margin-top: 5px;
}

.card {
    background: #111827;
    padding: 20px;
    margin: 20px auto;
    border-radius: 12px;
    max-width: 1200px;
}

button {
    padding: 10px 20px;
    background: #6366f1;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin: 3px;
}

button:hover {
    background: #4f46e5;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

input[type="file"] {
    max-width: 100%;
}

.file {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 12px;
    background: #1e293b;
    border-radius: 8px;
    text-align: left;
}

.file-name {
    overflow-wrap: anywhere;
    flex: 1;
}

.file-actions {
    display: flex;
    gap: 5px;
}

#status {
    margin: 12px;
    min-height: 20px;
    overflow-wrap: anywhere;
}

#list {
    margin-top: 15px;
}

@media(max-width: 600px) {
    .file {
        flex-direction: column;
        align-items: stretch;
    }

    .file-actions {
        justify-content: center;
    }
}
</style>
</head>

<body>

<h1>PDF MERGER</h1>
<p>Combine PDFs in the easiest way.</p>

<!-- PDF MERGER -->

<div class="card">

    <input type="file" id="pdfs" accept=".pdf,application/pdf" multiple>

    <br><br>

    <button id="mergeBtn" onclick="merge()">
        Merge PDFs
    </button>

</div>

<!-- MORE OPTIONS -->

<h3 onclick="unlock()" style="cursor:pointer;">
    ✨ More Options ✨
</h3>

<div id="secret" style="display:none;">

    <!-- UNIVERSAL UPLOAD -->

    <div class="card">

        <p>Upload your files here!</p>

        <input type="file" id="file">

        <br><br>

        <button id="uploadBtn" onclick="upload()">
            Upload
        </button>

        <p id="status"></p>

    </div>

    <!-- FILE LIST -->

    <div class="card">

        <p>Uploaded Files</p>

        <div id="list">
            Loading files...
        </div>

    </div>

</div>

<script>

let unlocked = false;

// =============== UNLOCK ===============

function unlock() {

    if (unlocked) return;

    const pass = prompt("Enter password:");

    if (pass === null) return;

    if (pass === "1234") {

        unlocked = true;

        document.getElementById("secret").style.display = "block";

        loadFiles();

    } else {

        alert("Wrong password");

    }
}

// =============== PDF MERGE ===============

async function merge() {

    const input = document.getElementById("pdfs");
    const files = input.files;
    const btn = document.getElementById("mergeBtn");

    if (files.length < 2) {
        alert("Please select at least two PDF files.");
        return;
    }

    const form = new FormData();

    for (const file of files) {
        form.append("pdfs", file);
    }

    btn.disabled = true;
    btn.innerText = "Merging...";

    try {

        const res = await fetch("/merge", {
            method: "POST",
            body: form
        });

        if (!res.ok) {
            const message = await res.text();
            throw new Error(message || "PDF merge failed.");
        }

        const blob = await res.blob();

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "merged.pdf";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        input.value = "";

    } catch (error) {

        alert(error.message);

    } finally {

        btn.disabled = false;
        btn.innerText = "Merge PDFs";

    }
}

// =============== UNIVERSAL UPLOAD ===============

async function upload() {

    const input = document.getElementById("file");
    const file = input.files[0];

    const btn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");

    if (!file) {
        alert("Please select a file first.");
        return;
    }

    const form = new FormData();

    form.append("file", file);

    btn.disabled = true;
    btn.innerText = "Uploading...";

    status.innerText = "Uploading " + file.name + "...";

    try {

        const res = await fetch("/upload", {
            method: "POST",
            body: form
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Upload failed.");
        }

        status.innerText = "Upload successful!";

        input.value = "";

        await loadFiles();

    } catch (error) {

        status.innerText = "Error: " + error.message;

    } finally {

        btn.disabled = false;
        btn.innerText = "Upload";

    }
}

// =============== LOAD FILES ===============

async function loadFiles() {

    const list = document.getElementById("list");

    list.innerText = "Loading files...";

    try {

        const res = await fetch("/files");

        const files = await res.json();

        if (!res.ok) {
            throw new Error(files.message || "Unable to load files.");
        }

        list.innerHTML = "";

        if (!Array.isArray(files) || files.length === 0) {

            list.innerText = "No files uploaded yet.";

            return;
        }

        files.forEach(file => {

            const row = document.createElement("div");
            row.className = "file";

            const name = document.createElement("span");
            name.className = "file-name";
            name.textContent = file.original_filename || "Unnamed file";

            const actions = document.createElement("div");
            actions.className = "file-actions";

            const downloadBtn = document.createElement("button");
            downloadBtn.textContent = "Download";

            downloadBtn.onclick = () => {

                const url = "/download?public_id=" +
                    encodeURIComponent(file.public_id);

                window.open(url, "_blank", "noopener");

            };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";

            deleteBtn.onclick = () => {
                del(file.public_id);
            };

            actions.appendChild(downloadBtn);
            actions.appendChild(deleteBtn);

            row.appendChild(name);
            row.appendChild(actions);

            list.appendChild(row);

        });

    } catch (error) {

        list.innerText = "Error loading files: " + error.message;

    }
}

// =============== DELETE FILE ===============

async function del(id) {

    if (!confirm("Are you sure you want to delete this file?")) {
        return;
    }

    const pass = prompt("Admin password:");

    if (pass === null) return;

    try {

        const res = await fetch("/delete", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                public_id: id,
                adminPassword: pass
            })

        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            throw new Error(data.message || "Delete failed.");
        }

        alert("File deleted successfully!");

        await loadFiles();

    } catch (error) {

        alert(error.message);

    }
}

</script>

</body>
</html>
